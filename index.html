<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Morijo System Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Professional Medical Blue Palette */
            --primary-900: #1e3a8a;
            --primary-800: #1e40af;
            --primary-700: #1d4ed8;
            --primary-600: #2563eb;
            --primary-500: #3b82f6;
            --primary-400: #60a5fa;
            --primary-300: #93c5fd;
            --primary-200: #bfdbfe;
            --primary-100: #dbeafe;
            --primary-50: #eff6ff;
            
            /* Neutral Professional Grays */
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-700: #374151;
            --gray-600: #4b5563;
            --gray-500: #6b7280;
            --gray-400: #9ca3af;
            --gray-300: #d1d5db;
            --gray-200: #e5e7eb;
            --gray-100: #f3f4f6;
            --gray-50: #f9fafb;
            
            /* Semantic Colors */
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --success: #059669;
            --success-light: #ecfdf5;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --info: #0891b2;
            
            /* Layout */
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; padding-bottom:80px; color:var(--text); line-height:1.5; }
        ::-webkit-scrollbar{width:8px;height:8px} 
        ::-webkit-scrollbar-thumb{background:var(--primary-200);border-radius:4px}
        ::-webkit-scrollbar-track{background:var(--gray-100)}
        .hidden{display:none!important}
        
        /* LOGIN - Professional Gradient */
        #login{
            position:fixed;inset:0;z-index:1000;
            background:linear-gradient(135deg,var(--primary-900) 0%,var(--primary-700) 50%,var(--primary-600) 100%);
            display:flex;justify-content:center;align-items:center;
        }
        #login::before{
            content:'';position:absolute;inset:0;
            background:radial-gradient(circle at 20% 50%,rgba(255,255,255,0.1) 0%,transparent 50%),
                       radial-gradient(circle at 80% 80%,rgba(255,255,255,0.05) 0%,transparent 40%);
        }
        .login-card{
            position:relative;background:rgba(255,255,255,0.95);
            backdrop-filter:blur(10px);
            padding:48px;width:90%;max-width:420px;
            border-radius:var(--radius);
            box-shadow:var(--shadow-lg);
            text-align:center;border:1px solid rgba(255,255,255,0.2)
        }
        .login-logo{
            width:72px;height:72px;background:linear-gradient(135deg,var(--primary-600),var(--primary-700));
            border-radius:20px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;
            font-size:2rem;box-shadow:0 10px 25px -5px rgba(37,99,235,0.4);
            color:white;
        }
        .login-card h2{color:var(--gray-900);font-size:1.75rem;font-weight:700;margin-bottom:8px;letter-spacing:-0.025em}
        .login-card p{color:var(--gray-500);font-size:0.95rem;margin-bottom:32px}
        .field{position:relative;margin-bottom:16px}
        .field input{
            width:100%;padding:14px 16px 14px 44px;
            background:var(--gray-50);border:1.5px solid var(--gray-200);
            border-radius:var(--radius-sm);color:var(--gray-900);
            font-size:0.95rem;font-family:'Inter',sans-serif;outline:none;
            transition:all 0.2s;
        }
        .field input:focus{border-color:var(--primary-500);background:white;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
        .field input::placeholder{color:var(--gray-400)}
        .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:1.1rem}
        .btn-primary{
            width:100%;padding:14px;background:var(--primary-600);color:#fff;border:none;
            border-radius:var(--radius-sm);font-size:0.95rem;font-weight:600;
            cursor:pointer;margin-top:8px;transition:all 0.2s;box-shadow:0 4px 6px -1px rgba(37,99,235,0.2);
        }
        .btn-primary:hover{background:var(--primary-700);transform:translateY(-1px);box-shadow:0 10px 15px -3px rgba(37,99,235,0.3)}
        .login-err{color:var(--danger);font-size:0.875rem;margin-top:12px;display:none;font-weight:500}
        .login-err.show{display:block}

        /* HEADER - Clean Professional */
        header{
            background:white;border-bottom:1px solid var(--border);
            padding:0 24px;position:sticky;top:0;z-index:100;
            box-shadow:var(--shadow-sm);
        }
        .head-content{
            max-width:1280px;margin:0 auto;height:64px;
            display:flex;align-items:center;gap:16px;
        }
        .head-logo{
            font-size:1.25rem;font-weight:700;color:var(--primary-700);
            display:flex;align-items:center;gap:10px;letter-spacing:-0.025em;
        }
        .head-logo span{
            background:var(--primary-100);color:var(--primary-700);
            padding:4px 10px;border-radius:6px;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
        }
        .head-spacer{flex:1}
        .user-badge{
            background:var(--primary-50);color:var(--primary-700);
            padding:6px 14px;border-radius:99px;font-size:0.875rem;font-weight:500;
            border:1px solid var(--primary-100);
        }
        .sync-status{
            font-size:0.75rem;color:var(--gray-500);margin-left:8px;
        }
        .sync-status.synced{color:var(--success)}
        .btn-exit{
            padding:8px 16px;background:white;border:1.5px solid var(--gray-200);
            color:var(--gray-600);border-radius:var(--radius-sm);cursor:pointer;
            font-size:0.875rem;font-weight:500;transition:all 0.2s;
        }
        .btn-exit:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}

        /* NAVIGATION - Professional Tabs */
        .nav-tabs{
            display:flex;gap:8px;margin:24px auto;max-width:1280px;padding:0 24px;
            background:transparent;
        }
        .nav-tab{
            padding:10px 20px;border:none;background:transparent;
            border-radius:var(--radius-sm);cursor:pointer;font-weight:500;
            color:var(--gray-500);font-size:0.9rem;white-space:nowrap;
            transition:all 0.2s;position:relative;
        }
        .nav-tab:hover{color:var(--primary-600);background:var(--primary-50)}
        .nav-tab.active{
            background:var(--primary-600);color:#fff;
            box-shadow:0 4px 6px -1px rgba(37,99,235,0.2);
        }

        /* MAIN CONTENT */
        .main{max-width:1280px;margin:0 auto;padding:0 24px;display:none}
        .main.active{display:block;animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        .section{display:none}
        .section.active{display:block;animation:fadeIn 0.3s ease}

        /* STATS GRID - Professional Cards */
        .stats-grid{
            display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:20px;margin-bottom:28px;
        }
        .stat-card{
            background:var(--card);padding:24px;border-radius:var(--radius);
            box-shadow:var(--shadow);border:1px solid var(--border);
            display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
        }
        .stat-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--primary-500);
        }
        .stat-card.red::before{background:var(--danger)}
        .stat-card.amber::before{background:var(--warning)}
        .stat-card.green::before{background:var(--success)}
        .stat-value{
            font-size:2rem;font-weight:700;color:var(--gray-900);letter-spacing:-0.025em;
            font-feature-settings:'tnum';
        }
        .stat-label{
            font-size:0.875rem;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:0.05em;
        }
        .stat-change{
            font-size:0.875rem;color:var(--gray-400);margin-top:4px;
        }

        /* FORMS - Clean Input Design */
        .form-group{
            display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:20px;
            margin-bottom:24px;background:var(--card);padding:24px;border-radius:var(--radius);
            box-shadow:var(--shadow);border:1px solid var(--border);
        }
        .form-field{display:flex;flex-direction:column;gap:6px}
        .form-field label{
            font-size:0.875rem;font-weight:600;color:var(--gray-900);text-transform:uppercase;letter-spacing:0.05em;
        }
        .form-field input, .form-field select, .form-field textarea{
            padding:12px 14px;background:var(--gray-50);border:1.5px solid var(--border);
            border-radius:var(--radius-sm);font-family:inherit;color:var(--gray-900);
            font-size:0.95rem;outline:none;transition:all 0.2s;
        }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus{
            border-color:var(--primary-500);background:white;box-shadow:0 0 0 3px rgba(59,130,246,0.1)
        }
        .form-field textarea{resize:vertical;min-height:80px}
        .form-actions{
            display:flex;gap:12px;margin-top:20px;
        }
        .btn-success{
            padding:12px 24px;background:var(--success);color:white;border:none;
            border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:0.95rem;
            transition:all 0.2s;
        }
        .btn-success:hover{background:#047857}
        .btn-danger{
            padding:8px 16px;background:var(--danger);color:white;border:none;
            border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:0.875rem;
            transition:all 0.2s;
        }
        .btn-danger:hover{background:#b91c1c}

        /* LISTS - Clean Item Display */
        .list-container{
            background:var(--card);border-radius:var(--radius);
            box-shadow:var(--shadow);border:1px solid var(--border);
            overflow:hidden;
        }
        .list-item{
            padding:20px;border-bottom:1px solid var(--border);
            display:flex;justify-content:space-between;align-items:flex-start;
            gap:16px;
            transition:background 0.2s;
        }
        .list-item:last-child{border-bottom:none}
        .list-item:hover{background:var(--gray-50)}
        .list-item.red{border-left:4px solid var(--danger)}
        .list-item.green{border-left:4px solid var(--success)}
        .list-item.blue{border-left:4px solid var(--primary-500)}
        .list-content{flex:1}
        .list-title{
            font-weight:600;color:var(--gray-900);margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        }
        .list-meta{
            font-size:0.875rem;color:var(--text-secondary);
        }
        .list-actions{
            display:flex;gap:10px;
        }
        .badge{
            display:inline-block;padding:4px 10px;border-radius:6px;font-size:0.75rem;
            font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
        }
        .badge-primary{background:var(--primary-100);color:var(--primary-700)}
        .badge-success{background:var(--success-light);color:var(--success)}
        .badge-danger{background:var(--danger-light);color:var(--danger)}

        /* EMPTY STATE */
        .empty{
            padding:60px 20px;text-align:center;color:var(--text-secondary);
        }
        .empty-icon{
            font-size:3rem;margin-bottom:16px;
        }

        /* LOCATION CARDS */
        .locations-grid{
            display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;
            margin-bottom:28px;
        }
        .location-card{
            background:var(--card);padding:20px;border-radius:var(--radius);
            box-shadow:var(--shadow);border:1px solid var(--border);
            text-align:center;
        }
        .location-name{
            font-weight:700;font-size:1.1rem;color:var(--primary-700);margin-bottom:8px;
        }
        .location-stats{
            font-size:0.875rem;color:var(--text-secondary);
        }

        /* MESSAGE ALERT */
        .msg-box{
            position:fixed;top:20px;right:20px;z-index:999;
            padding:16px 20px;border-radius:var(--radius-sm);
            color:white;font-weight:600;font-size:0.95rem;
            max-width:300px;animation:slideIn 0.3s ease;
            box-shadow:var(--shadow-lg);
        }
        @keyframes slideIn{from{transform:translateX(350px);opacity:0}to{transform:translateX(0);opacity:1}}
        .msg-box.success{background:var(--success)}
        .msg-box.err{background:var(--danger)}
        .msg-box.info{background:var(--info)}

        /* RESPONSIVE */
        @media (max-width:768px){
            .form-group{grid-template-columns:1fr}
            .stats-grid{grid-template-columns:repeat(2, 1fr)}
            .locations-grid{grid-template-columns:1fr}
            .list-item{flex-direction:column}
            .list-actions{width:100%}
        }
    </style>
</head>

<body>
    <!-- LOGIN SCREEN -->
    <div id="login">
        <div class="login-card">
            <div class="login-logo">🏥</div>
            <h2>Morijo Health</h2>
            <p>System Management Portal</p>
            <div class="field">
                <span class="field-icon">👤</span>
                <input type="text" id="user" placeholder="Username" autocomplete="off">
            </div>
            <div class="field">
                <span class="field-icon">🔐</span>
                <input type="password" id="pwd" placeholder="Password">
            </div>
            <button class="btn-primary" onclick="accedi()">Login</button>
            <div class="login-err" id="loginErr"></div>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <header>
        <div class="head-content">
            <div class="head-logo">🏥 <strong>MORIJO</strong> <span>HEALTH</span></div>
            <div class="head-spacer"></div>
            <div class="user-badge" id="userDisplay"></div>
            <div class="sync-status" id="syncStatus">offline</div>
            <button class="btn-exit" onclick="esci()">Logout</button>
        </div>
    </header>

    <div class="main" id="mainContent">
        <!-- NAVIGATION TABS -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
            <button class="nav-tab" onclick="switchTab('patients')">👥 Patients</button>
            <button class="nav-tab" onclick="switchTab('visits')">🏥 Visits</button>
            <button class="nav-tab" onclick="switchTab('births')">👶 Births</button>
            <button class="nav-tab" onclick="switchTab('deaths')">⚰️ Deaths</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div class="section" id="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statPazienti">0</div>
                    <div class="stat-label">Total Patients</div>
                    <div class="stat-change">Active records</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="statNascite">0</div>
                    <div class="stat-label">Births</div>
                    <div class="stat-change">This year</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-value" id="statDecessi">0</div>
                    <div class="stat-label">Deaths</div>
                    <div class="stat-change">Recorded</div>
                </div>
                <div class="stat-card amber">
                    <div class="stat-value" id="statVisite">0</div>
                    <div class="stat-label">Today's Visits</div>
                    <div class="stat-change">Current</div>
                </div>
            </div>
            <div class="locations-grid" id="locationStats"></div>
        </div>

        <!-- PATIENTS SECTION -->
        <div class="section" id="patients">
            <div class="form-group">
                <h3 style="grid-column:1/-1;margin-bottom:16px">Add New Patient</h3>
                <div class="form-field">
                    <label>First Name</label>
                    <input type="text" id="pNome" placeholder="John">
                </div>
                <div class="form-field">
                    <label>Last Name</label>
                    <input type="text" id="pCognome" placeholder="Doe">
                </div>
                <div class="form-field">
                    <label>Age</label>
                    <input type="number" id="pEta" placeholder="25" min="0" max="120">
                </div>
                <div class="form-field">
                    <label>Location</label>
                    <select id="pLocation">
                        <option value="">Select location</option>
                        <option>Morijo</option>
                        <option>Angata</option>
                        <option>Marti</option>
                        <option>Ngorika</option>
                    </select>
                </div>
                <div class="form-field" style="grid-column:1/-1">
                    <label>Notes</label>
                    <textarea id="pNote" placeholder="Medical notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-success" onclick="salvaPaziente()">✓ Add Patient</button>
                </div>
            </div>
            <div class="list-container">
                <div id="listaPazienti"></div>
            </div>
        </div>

        <!-- VISITS SECTION -->
        <div class="section" id="visits">
            <div class="form-group">
                <h3 style="grid-column:1/-1;margin-bottom:16px">Register Visit</h3>
                <div class="form-field">
                    <label>Date</label>
                    <input type="date" id="vData">
                </div>
                <div class="form-field">
                    <label>Patient</label>
                    <select id="vPaziente"></select>
                </div>
                <div class="form-field">
                    <label>Location</label>
                    <select id="vLocation">
                        <option value="">Select location</option>
                        <option>Morijo</option>
                        <option>Angata</option>
                        <option>Marti</option>
                        <option>Ngorika</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Visit Type</label>
                    <select id="vTipo">
                        <option value="">Select type</option>
                        <option>Preventive</option>
                        <option>Follow-up</option>
                        <option>Emergency</option>
                        <option>Vaccination</option>
                    </select>
                </div>
                <div class="form-field" style="grid-column:1/-1">
                    <label>Notes</label>
                    <textarea id="vNote" placeholder="Visit notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-success" onclick="salvaVisita()">✓ Register Visit</button>
                </div>
            </div>
            <div class="list-container">
                <div id="listaVisite"></div>
            </div>
        </div>

        <!-- BIRTHS SECTION -->
        <div class="section" id="births">
            <div class="form-group">
                <h3 style="grid-column:1/-1;margin-bottom:16px">Register Birth</h3>
                <div class="form-field">
                    <label>Birth Date</label>
                    <input type="date" id="mData">
                </div>
                <div class="form-field">
                    <label>Mother</label>
                    <select id="mMadre"></select>
                </div>
                <div class="form-field">
                    <label>Location</label>
                    <select id="mLocation">
                        <option value="">Select location</option>
                        <option>Morijo</option>
                        <option>Angata</option>
                        <option>Marti</option>
                        <option>Ngorika</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Sex</label>
                    <select id="mSesso">
                        <option value="">Select</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Weight (kg)</label>
                    <input type="number" id="mPeso" placeholder="3.5" min="0" step="0.1">
                </div>
                <div class="form-field" style="grid-column:1/-1">
                    <label>Notes</label>
                    <textarea id="mNote" placeholder="Birth notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-success" onclick="salvaNascita()">✓ Register Birth</button>
                </div>
            </div>
            <div class="list-container">
                <div id="listaNascite"></div>
            </div>
        </div>

        <!-- DEATHS SECTION -->
        <div class="section" id="deaths">
            <div class="form-group">
                <h3 style="grid-column:1/-1;margin-bottom:16px">Register Death</h3>
                <div class="form-field">
                    <label>Date</label>
                    <input type="date" id="dData">
                </div>
                <div class="form-field">
                    <label>Patient</label>
                    <select id="dPaziente"></select>
                </div>
                <div class="form-field">
                    <label>Location</label>
                    <select id="dLocation">
                        <option value="">Select location</option>
                        <option>Morijo</option>
                        <option>Angata</option>
                        <option>Marti</option>
                        <option>Ngorika</option>
                    </select>
                </div>
                <div class="form-field" style="grid-column:1/-1">
                    <label>Cause of Death</label>
                    <textarea id="dCausa" placeholder="Cause..."></textarea>
                </div>
                <div class="form-field" style="grid-column:1/-1">
                    <label>Notes</label>
                    <textarea id="dNote" placeholder="Additional notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-success" onclick="salvaDecesso()">✓ Register Death</button>
                </div>
            </div>
            <div class="list-container">
                <div id="listaDecessi"></div>
            </div>
        </div>
    </div>

<script>
    // ===== JSONBIN.IO CONFIGURATION =====
    // INSERISCI QUI IL TUO BIN ID E MASTER KEY
    const JSONBIN_BIN_ID = '69c860196860e0745bfd75f6';
    const JSONBIN_MASTER_KEY = '$2a$10$Z2lQjwDW.9ncUrm8gnE75uG9HdkCoNVsgmitFJCo2/3MAvSoMl8Pu';
    const JSONBIN_BASE_URL = 'https://api.jsonbin.io/v3/b';
    
    // Credenziali di login
    const VALID_USER = 'admin';
    const VALID_PWD = 'password123';

    // ===== DATA STRUCTURE =====
    const defaultData = {
        pazienti: [],
        visite: [],
        nascite: [],
        decessi: []
    };

    // ===== STATE =====
    let currentUser = null;
    let allData = { ...defaultData };

    // ===== JSONBIN SYNC FUNCTIONS =====
    async function loadDataFromJsonBin() {
        try {
            const response = await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_BIN_ID}`, {
                method: 'GET',
                headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
            });
            if (response.ok) {
                const result = await response.json();
                allData = result.record || defaultData;
                updateSyncStatus(true);
                return true;
            }
        } catch (e) {
            console.log('JSONBin load error (using local data):', e);
        }
        updateSyncStatus(false);
        return false;
    }

    async function saveDataToJsonBin() {
        if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID === 'YOUR_BIN_ID_HERE') {
            console.log('JSONBin not configured, using local storage');
            return false;
        }
        try {
            const response = await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_MASTER_KEY
                },
                body: JSON.stringify(allData)
            });
            if (response.ok) {
                updateSyncStatus(true);
                return true;
            }
        } catch (e) {
            console.log('JSONBin save error:', e);
        }
        updateSyncStatus(false);
        return false;
    }

    function updateSyncStatus(synced) {
        const status = document.getElementById('syncStatus');
        if (synced) {
            status.textContent = '✓ synced';
            status.classList.add('synced');
        } else {
            status.textContent = 'offline';
            status.classList.remove('synced');
        }
    }

    // ===== CRUD FUNCTIONS (ora usano allData) =====
    function getPazienti() { return allData.pazienti || []; }
    function setPazienti(p) { allData.pazienti = p; saveDataToJsonBin(); }

    function getVisite() { return allData.visite || []; }
    function setVisite(v) { allData.visite = v; saveDataToJsonBin(); }

    function getNascite() { return allData.nascite || []; }
    function setNascite(n) { allData.nascite = n; saveDataToJsonBin(); }

    function getDecessi() { return allData.decessi || []; }
    function setDecessi(d) { allData.decessi = d; saveDataToJsonBin(); }

    // ===== UI FUNCTIONS =====
    function msg(text, type = 'success') {
        const box = document.createElement('div');
        box.className = `msg-box ${type}`;
        box.textContent = text;
        document.body.appendChild(box);
        setTimeout(() => box.remove(), 3000);
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        event.target.classList.add('active');
        
        if (tab === 'visits') aggiornaPazientiSelects();
        if (tab === 'births') aggiornaMadriSelects();
        if (tab === 'deaths') aggiornaPazientiDeathSelects();
    }

    function aggiornaPazientiSelects() {
        const select = document.getElementById('vPaziente');
        select.innerHTML = '<option value="">Select patient</option>' + 
            getPazienti().map(p => `<option value="${p.id}">${p.cognome} ${p.nome}</option>`).join('');
    }

    function aggiornaMadriSelects() {
        const select = document.getElementById('mMadre');
        select.innerHTML = '<option value="">Select mother</option>' + 
            getPazienti().map(p => `<option value="${p.id}">${p.cognome} ${p.nome}</option>`).join('');
    }

    function aggiornaPazientiDeathSelects() {
        const select = document.getElementById('dPaziente');
        select.innerHTML = '<option value="">Select patient</option>' + 
            getPazienti().map(p => `<option value="${p.id}">${p.cognome} ${p.nome}</option>`).join('');
    }

    // ===== LOGIN =====
    async function accedi() {
        const user = document.getElementById('user').value.trim();
        const pwd = document.getElementById('pwd').value;
        
        if (user === VALID_USER && pwd === VALID_PWD) {
            currentUser = user;
            document.getElementById('login').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userDisplay').textContent = `👤 ${user}`;
            
            await loadDataFromJsonBin();
            aggiornaDashboard();
            msg('Login successful', 'success');
        } else {
            document.getElementById('loginErr').classList.add('show');
            document.getElementById('loginErr').textContent = 'Invalid credentials';
        }
    }

    function esci() {
        if (confirm('Logout?')) {
            currentUser = null;
            document.getElementById('login').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('user').value = '';
            document.getElementById('pwd').value = '';
            document.getElementById('loginErr').classList.remove('show');
        }
    }

    // ===== PATIENTS =====
    function salvaPaziente() {
        const nome = document.getElementById('pNome').value.trim();
        const cognome = document.getElementById('pCognome').value.trim();
        const eta = parseInt(document.getElementById('pEta').value) || 0;
        const location = document.getElementById('pLocation').value;
        const note = document.getElementById('pNote').value.trim();

        if (!nome || !cognome || !location) {
            msg('Please fill in all required fields', 'err');
            return;
        }

        const pazienti = getPazienti();
        pazienti.push({
            id: Date.now(),
            nome,
            cognome,
            eta,
            location,
            note,
            timestamp: new Date().toISOString()
        });

        setPazienti(pazienti);
        msg('Patient added successfully');
        renderListaPazienti();
        aggiornaDashboard();
        
        document.getElementById('pNome').value = '';
        document.getElementById('pCognome').value = '';
        document.getElementById('pEta').value = '';
        document.getElementById('pNote').value = '';
    }

    function renderListaPazienti() {
        const pazienti = getPazienti();
        const container = document.getElementById('listaPazienti');
        
        if (pazienti.length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">👥</div>No patients recorded</div>';
            return;
        }

        container.innerHTML = pazienti.map(p => `
            <div class="list-item blue">
                <div class="list-content">
                    <div class="list-title">
                        ${p.cognome} ${p.nome}
                        <span class="badge badge-primary">${p.location}</span>
                        ${p.eta ? `<span class="badge badge-primary">Age: ${p.eta}</span>` : ''}
                    </div>
                    ${p.note ? `<div style="margin-top:8px;font-style:italic">${p.note}</div>` : ''}
                </div>
                <div class="list-actions">
                    <button class="btn-danger" onclick="eliminaPaziente(${p.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function eliminaPaziente(id) {
        if (!confirm('Delete this patient?')) return;
        setPazienti(getPazienti().filter(p => p.id !== id));
        renderListaPazienti();
        aggiornaDashboard();
    }

    // ===== VISITS =====
    function salvaVisita() {
        const data = document.getElementById('vData').value;
        const pazienteId = parseInt(document.getElementById('vPaziente').value);
        const location = document.getElementById('vLocation').value;
        const tipo = document.getElementById('vTipo').value;
        const note = document.getElementById('vNote').value.trim();

        if (!data || !pazienteId || !location || !tipo) {
            msg('Please fill in all required fields', 'err');
            return;
        }

        const paz = getPazienti().find(p => p.id === pazienteId);
        const visite = getVisite();
        
        visite.push({
            id: Date.now(),
            data,
            pazienteId,
            pazienteNome: paz ? `${paz.cognome} ${paz.nome}` : 'Unknown',
            location,
            tipo,
            note,
            timestamp: new Date().toISOString()
        });

        setVisite(visite);
        msg('Visit registered');
        renderListaVisite();
        aggiornaDashboard();
        
        document.getElementById('vNote').value = '';
    }

    function renderListaVisite() {
        const visite = getVisite().sort((a,b) => new Date(b.data) - new Date(a.data));
        const container = document.getElementById('listaVisite');
        
        if (visite.length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">🏥</div>No visits recorded</div>';
            return;
        }

        container.innerHTML = visite.map(v => `
            <div class="list-item blue">
                <div class="list-content">
                    <div class="list-title">
                        ${v.pazienteNome}
                        <span class="badge badge-primary">${v.tipo}</span>
                        <span class="badge badge-primary">${v.location}</span>
                    </div>
                    <div class="list-meta">
                        <strong>Date:</strong> ${new Date(v.data).toLocaleDateString('en-GB')}
                    </div>
                    ${v.note ? `<div style="margin-top:8px;font-style:italic">${v.note}</div>` : ''}
                </div>
                <div class="list-actions">
                    <button class="btn-danger" onclick="eliminaVisita(${v.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function eliminaVisita(id) {
        if (!confirm('Delete this visit?')) return;
        setVisite(getVisite().filter(v => v.id !== id));
        renderListaVisite();
        aggiornaDashboard();
    }

    // ===== BIRTHS =====
    function salvaNascita() {
        const data = document.getElementById('mData').value;
        const madreId = parseInt(document.getElementById('mMadre').value);
        const location = document.getElementById('mLocation').value;
        const sesso = document.getElementById('mSesso').value;
        const peso = parseFloat(document.getElementById('mPeso').value) || 0;
        const note = document.getElementById('mNote').value.trim();

        if (!data || !madreId) {
            msg('Please enter date and select mother', 'err');
            return;
        }

        const nascite = getNascite();
        const madre = getPazienti().find(p => p.id === madreId);
        
        nascite.push({
            id: Date.now(),
            data,
            madreId,
            madreNome: madre ? `${madre.cognome} ${madre.nome}` : 'Unknown',
            location,
            sesso,
            peso,
            note,
            timestamp: new Date().toISOString()
        });

        setNascite(nascite);
        msg('Birth registered successfully');
        renderListaNascite();
        aggiornaDashboard();
        
        document.getElementById('mPeso').value = '';
        document.getElementById('mNote').value = '';
    }

    function renderListaNascite() {
        const nascite = getNascite().sort((a,b) => new Date(b.data) - new Date(a.data));
        const container = document.getElementById('listaNascite');
        
        if (nascite.length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">👶</div>No births recorded</div>';
            return;
        }

        container.innerHTML = nascite.map(n => `
            <div class="list-item green">
                <div class="list-content">
                    <div class="list-title">
                        ${n.sesso === 'M' ? 'Male' : 'Female'} Infant
                        <span class="badge badge-primary">${n.location}</span>
                        ${n.peso ? `<span class="badge badge-success">${n.peso} kg</span>` : ''}
                    </div>
                    <div class="list-meta">
                        <strong>Birth Date:</strong> ${new Date(n.data).toLocaleDateString('en-GB')} &nbsp;|&nbsp; 
                        <strong>Mother:</strong> ${n.madreNome}
                    </div>
                    ${n.note ? `<div style="margin-top:8px;font-style:italic">${n.note}</div>` : ''}
                </div>
                <div class="list-actions">
                    <button class="btn-danger" onclick="eliminaNascita(${n.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function eliminaNascita(id) {
        if (!confirm('Delete this birth record?')) return;
        setNascite(getNascite().filter(n => n.id !== id));
        renderListaNascite();
        aggiornaDashboard();
    }

    // ===== DEATHS =====
    function salvaDecesso() {
        const data = document.getElementById('dData').value;
        const pazienteId = parseInt(document.getElementById('dPaziente').value);
        const location = document.getElementById('dLocation').value;
        const causa = document.getElementById('dCausa').value.trim();
        const note = document.getElementById('dNote').value.trim();

        if (!data || !pazienteId || !causa) {
            msg('Please fill in all required fields', 'err');
            return;
        }

        const paz = getPazienti().find(p => p.id === pazienteId);
        const decessi = getDecessi();
        
        decessi.push({
            id: Date.now(),
            data,
            pazienteId,
            pazienteNome: paz ? `${paz.cognome} ${paz.nome}` : 'Unknown',
            location,
            causa,
            note,
            timestamp: new Date().toISOString()
        });

        setDecessi(decessi);
        msg('Death registered');
        renderListaDecessi();
        aggiornaDashboard();
        
        document.getElementById('dCausa').value = '';
        document.getElementById('dNote').value = '';
    }

    function renderListaDecessi() {
        const decessi = getDecessi().sort((a,b) => new Date(b.data) - new Date(a.data));
        const container = document.getElementById('listaDecessi');
        
        if (decessi.length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">⚰️</div>No deaths recorded</div>';
            return;
        }

        container.innerHTML = decessi.map(d => `
            <div class="list-item red">
                <div class="list-content">
                    <div class="list-title">
                        ${d.pazienteNome}
                        <span class="badge badge-danger">${d.location}</span>
                    </div>
                    <div class="list-meta">
                        <strong>Date:</strong> ${new Date(d.data).toLocaleDateString('en-GB')} &nbsp;|&nbsp; 
                        <strong>Cause:</strong> ${d.causa}
                    </div>
                    ${d.note ? `<div style="margin-top:8px;font-style:italic">${d.note}</div>` : ''}
                </div>
                <div class="list-actions">
                    <button class="btn-danger" onclick="eliminaDecesso(${d.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function eliminaDecesso(id) {
        if (!confirm('Delete this record?')) return;
        setDecessi(getDecessi().filter(d => d.id !== id));
        renderListaDecessi();
        aggiornaDashboard();
    }

    // ===== DASHBOARD =====
    function aggiornaDashboard() {
        const pazienti = getPazienti();
        const visite = getVisite();
        const nascite = getNascite();
        const decessi = getDecessi();
        
        document.getElementById('statPazienti').textContent = pazienti.length;
        document.getElementById('statNascite').textContent = nascite.length;
        document.getElementById('statDecessi').textContent = decessi.length;
        
        const oggi = new Date().toISOString().split('T')[0];
        document.getElementById('statVisite').textContent = visite.filter(v => v.data === oggi).length;

        // Location Stats
        const locs = ['Morijo', 'Angata', 'Marti', 'Ngorika'];
        document.getElementById('locationStats').innerHTML = locs.map(loc => {
            const pazCount = pazienti.filter(p => p.location === loc).length;
            const visCount = visite.filter(v => v.location === loc).length;
            return `
            <div class="location-card">
                <div class="location-name">${loc}</div>
                <div class="location-stats">${pazCount} patients • ${visCount} visits</div>
            </div>`;
        }).join('');
    }

    // ===== INIT & LOGIN SHORTCUT =====
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !document.getElementById('login').classList.contains('hidden')) accedi();
    });

    // Set today's date in date inputs
    document.addEventListener('DOMContentLoaded', () => {
        const oggi = new Date().toISOString().split('T')[0];
        document.getElementById('vData').value = oggi;
        document.getElementById('mData').value = oggi;
        document.getElementById('dData').value = oggi;
    });
</script>
